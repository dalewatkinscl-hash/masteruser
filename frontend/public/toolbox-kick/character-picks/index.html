<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chelle character picks</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
    body { margin: 0; background: #070f1c; color: #e2e8f0; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; color: #fde68a; }
    p { margin: 0 0 20px; color: #94a3b8; max-width: 52rem; line-height: 1.45; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    figure {
      margin: 0; background: #0b1220; border: 1px solid #1a2540; border-radius: 16px;
      padding: 16px; text-align: center;
    }
    .stage {
      height: 220px; display: grid; place-items: center;
      background:
        linear-gradient(#7dd3fc, #bae6fd 55%, transparent 55%),
        linear-gradient(#4a7c3f, #4a7c3f);
      background-size: 100% 100%, 100% 40%;
      background-position: top, bottom;
      background-repeat: no-repeat;
      border-radius: 12px;
    }
    img { max-height: 190px; image-rendering: auto; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
    figcaption { margin-top: 12px; }
    strong { display: block; color: #f8fafc; margin-bottom: 4px; }
    small { color: #94a3b8; line-height: 1.35; display: block; }
  </style>
</head>
<body>
  <h1>Pick Chelle’s look</h1>
  <p>
    Free CC0 options from Kenney packs. Reply with the letter you want
    (A–E). We can also tweak hair/outfit after you choose.
  </p>
  <div class="grid">
    <figure>
      <div class="stage"><img src="./A_toon_adventurer_blonde.png" alt="Option A" /></div>
      <figcaption>
        <strong>A · Toon Adventurer (current)</strong>
        <small>Blocky chibi · blonde recolor · satchel</small>
      </figcaption>
    </figure>
    <figure>
      <div class="stage"><img src="./B_toon_female_person.png" alt="Option B" /></div>
      <figcaption>
        <strong>B · Toon Female Person</strong>
        <small>Same pack · darker hair · hoop earrings · green tee</small>
      </figcaption>
    </figure>
    <figure>
      <div class="stage"><img src="./E_toon_person_blonde.png" alt="Option E" /></div>
      <figcaption>
        <strong>E · Toon Female Person · blonde</strong>
        <small>Option B with blonde hair</small>
      </figcaption>
    </figure>
    <figure>
      <div class="stage"><img src="./C_classic_platformer_female.png" alt="Option C" /></div>
      <figcaption>
        <strong>C · Classic Platformer Girl</strong>
        <small>Older Kenney style · rounder · brown hair</small>
      </figcaption>
    </figure>
    <figure>
      <div class="stage"><img src="./D_classic_female_blonde.png" alt="Option D" /></div>
      <figcaption>
        <strong>D · Classic Platformer Girl · blonde</strong>
        <small>Option C with blonde hair · often reads cuter</small>
      </figcaption>
    </figure>
  </div>
</body>
</html>
