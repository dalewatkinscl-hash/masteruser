<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Admin Portal · Country Lion</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('cl_employee_portal_theme');
          if (theme === 'light' || theme === 'dark' || theme === 'kawaii') {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
