<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Lion Employee Portal</title>
    <meta
      name="description"
      content="Country Lion Employee Portal — profile, people cases, HR tools, and workplace apps for Country Lion staff."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="application-name" content="Country Lion Employee Portal" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://employee.countrylion.co.uk/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Country Lion Employee Portal" />
    <meta property="og:title" content="Country Lion Employee Portal" />
    <meta
      property="og:description"
      content="Sign in to manage your Country Lion profile, cases, and workplace tools."
    />
    <meta property="og:url" content="https://employee.countrylion.co.uk/" />
    <meta property="og:image" content="https://employee.countrylion.co.uk/letterhead/header.png" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Country Lion Employee Portal" />
    <meta
      name="twitter:description"
      content="Sign in to manage your Country Lion profile, cases, and workplace tools."
    />
    <meta name="twitter:image" content="https://employee.countrylion.co.uk/letterhead/header.png" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('cl_employee_portal_theme');
          if (theme === 'light' || theme === 'dark' || theme === 'kawaii') {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
